  <text x="58" y="174" fill="#f3efe9" font-family="Georgia, 'Times New Roman', serif" font-size="72">Proofs</text>
  <text x="58" y="251" fill="#d0c5e8" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic">in the rain.</text>
