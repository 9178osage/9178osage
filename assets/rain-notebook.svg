<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Proofs in the rain</title>
  <desc id="description">An original lavender-haired listener in headphones sits with a mathematics notebook beside a rainy circular window. A geometric diagram builds a square out of successive odd numbers.</desc>
  <defs>
