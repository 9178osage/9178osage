<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Music corner: a side of rain</title>
  <desc id="description">An original lavender cassette tape, a simple sound wave, and slowly drifting rain. Decorative art only, with no audio, tracking, live playback, or listening data. Motion is disabled when reduced motion is requested.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#262e44"/>
      <stop offset="1" stop-color="#1b3043"/>
    </linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .rain { animation: drift 9s ease-in-out infinite; }
    }
    @keyframes drift {
      0%, 100% { transform: translateY(-4px); }
      50% { transform: translateY(5px); }
    }
  </style>
  <rect width="1200" height="300" rx="20" fill="url(#background)"/>
  <path d="M34 34H1166M34 266H1166" stroke="#b6bad5" stroke-opacity=".2"/>
  <text x="53" y="76" fill="#c5c6e0" font-family="ui-monospace, monospace" font-size="16" letter-spacing="3">MUSIC CORNER / VOCALOID</text>
  <text x="49" y="147" fill="#f1ebe6" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic">A side of rain.</text>
  <text x="53" y="197" fill="#c4d2e0" font-family="system-ui, sans-serif" font-size="22">A little louder in my headphones.</text>
  <path d="M54 235h45l6-7 8 14 9-22 8 29 10-20 7 6h55" fill="none" stroke="#afaaca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="rain" stroke="#b4cddd" stroke-width="2" stroke-linecap="round" opacity=".45">
    <path d="M692 65l-6 17m65-39-5 15m74-4-5 15m66-26-5 15m79-7-5 15m78-23-5 15m62 28-5 15M685 195l-5 15m55 23-5 15m338-20-5 15m40-64-5 15"/>
  </g>
  <g transform="translate(767 82) rotate(-5 140 80)">
    <rect width="286" height="164" rx="15" fill="#b8aecf" stroke="#dad3e5" stroke-width="2"/>
    <rect x="17" y="19" width="252" height="105" rx="9" fill="#e9e4e6"/>
    <path d="M18 45H268" stroke="#aaa0ba" stroke-width="2"/>
    <text x="32" y="38" fill="#3d4056" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">OSAGE / LISTENING NOTES</text>
    <rect x="41" y="61" width="204" height="43" rx="21" fill="#41536a"/>
    <path d="M91 82H195" stroke="#c3ccda" stroke-width="2"/>
    <g fill="#e9e4e6" stroke="#334359" stroke-width="2">
      <circle cx="75" cy="82" r="17"/>
      <circle cx="212" cy="82" r="17"/>
    </g>
    <g fill="#41536a">
      <circle cx="75" cy="82" r="6"/>
      <circle cx="212" cy="82" r="6"/>
    </g>
    <path d="M87 131H199L211 156H75Z" fill="#8d87a8" stroke="#645f80" stroke-width="2"/>
    <g fill="#504f69">
      <circle cx="17" cy="145" r="3"/>
      <circle cx="269" cy="145" r="3"/>
    </g>
  </g>
</svg>
